name: languages

on:
  schedule:
    - cron: "0 6 * * 1"      # segunda-feira, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/build-languages.sh']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rebuild languages.svg
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/build-languages.sh
      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --staged --quiet || git commit -m "chore: refresh languages card"
          git diff --quiet HEAD@{1} HEAD 2>/dev/null || git push
